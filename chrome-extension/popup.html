<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Athlos AI</title>
  <style>
    body { font-family: 'Inter', sans-serif; padding: 16px; width: 250px; background: #111; color: white; margin: 0; }
    input { width: 100%; padding: 8px; margin: 8px 0; background: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; background: #ea580c; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; }
    button:hover { background: #c2410c; }
    .title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #fb923c; }
  </style>
</head>
<body>
  <div class="title">Athlos AI Companion</div>
  <p style="font-size: 12px; color: #aaa;">Masukkan URL server Athlos Anda:</p>
  <input type="text" id="urlInput" placeholder="http://localhost:3000" />
  <button id="saveBtn">Simpan Pengaturan</button>
  <br><br>
  <button id="openBtn" style="background: #2563eb;">Buka Athlos AI</button>
  <script src="popup.js"></script>
</body>
</html>
